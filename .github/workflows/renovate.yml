name: Renovate

on:
  schedule:
    # Follow HA-MCP master daily; Dependabot keeps its separate Thursday run.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - info
          - warn
          - error

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate Renovate App token
        id: renovate_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          renovate-version: "44.46.4"
          token: ${{ steps.renovate_app_token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_ALLOWED_COMMANDS: >-
            ["^python scripts/sync_ha_mcp_runtime_contract\\.py --contract-ref$", "^python scripts/bump_component_version\\.py origin/master$"]
          RENOVATE_REPOSITORIES: ${{ github.repository }}
