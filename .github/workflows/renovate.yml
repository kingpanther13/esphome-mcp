name: Renovate

on:
  push:
    # A merge into master is what leaves the other update branches behind, and
    # the ruleset requires them to be up to date. Reacting to the merge rebases
    # them within seconds instead of parking them until the next scheduled run.
    branches:
      - master
  schedule:
    # Picks up new upstream versions, and covers the case a push cannot: a
    # Dependabot auto-merge lands via GITHUB_TOKEN, which by design starts no
    # further workflow runs. Dependabot keeps its separate Thursday run.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - info
          - warn
          - error

# Two triggers now overlap, and concurrent Renovate runs would race each other
# rebasing the same branches. Queue instead of cancelling: interrupting a run
# mid-rebase can leave a branch half-written.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate Renovate App token
        id: renovate_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.4
        with:
          renovate-version: "44.48.0"
          token: ${{ steps.renovate_app_token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_ALLOWED_COMMANDS: >-
            ["^python scripts/sync_ha_mcp_runtime_contract\\.py --contract-ref$", "^python scripts/bump_component_version\\.py origin/master$"]
          RENOVATE_REPOSITORIES: ${{ github.repository }}
