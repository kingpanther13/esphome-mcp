name: PR Validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate-config:
    name: Renovate Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate Renovate configuration
        run: npx --yes --package renovate@44.103.1 renovate-config-validator renovate.json
      - name: Smoke-test the Renovate container
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*renovate-version: "\([^" ]*\)".*/\1/p' .github/workflows/renovate.yml)"
          test -n "$version"
          docker run --rm --volume "$PWD:/repo" --workdir /repo \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            "ghcr.io/renovatebot/renovate:$version" --platform=local --dry-run=extract \
            2>&1 | tee "$RUNNER_TEMP/renovate-startup.log"
          # Older Renovate versions exited zero even after a bootstrap crash.
          grep -q 'Repository finished' "$RUNNER_TEMP/renovate-startup.log"
          ! grep -Eq 'ERROR|FATAL' "$RUNNER_TEMP/renovate-startup.log"

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dev tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check custom_components tests scripts
      - name: Ruff format check
        run: ruff format --check --diff custom_components tests scripts

  dependency-sandbox:
    name: Runtime Dependency Sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Runtime dependency sandbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/check_runtime_dependency_sandbox.py
          python scripts/sync_ha_mcp_runtime_contract.py --contract-ref --check

  unit:
    name: Unit Tests
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dev tools
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/src/unit
      - name: Check HA-MCP watcher (read only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/watch_ha_mcp_component.py --check-only

  release-metadata:
    name: Release Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate release metadata
        run: python scripts/validate_release_metadata.py
      - name: Validate version bump for component changes
        run: python scripts/check_version_bump.py "origin/${{ github.base_ref || 'master' }}"

  host-device-e2e:
    name: ESPHome Host Device E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
      - name: Cache ESPHome host PlatformIO data
        uses: actions/cache@v6
        with:
          path: ~/.esphome-mcp-host-e2e/platformio
          key: esphome-host-device-pio-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'tests/src/e2e/host_device/**') }}
          restore-keys: |
            esphome-host-device-pio-${{ runner.os }}-
      - name: Install host-device E2E dependencies
        run: python -m pip install -e ".[dev,host-e2e]"
      - name: Run ESPHome host-device E2E
        run: pytest tests/src/e2e/host_device -v --tb=short --maxfail=1
